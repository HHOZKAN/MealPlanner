services:
  # Service PHP/Laravel - Gère l'application backend
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: mealplanner_backend
    volumes:
      - ./backend/laravel:/var/www
    depends_on:
      - db
    networks:
      - mealplanner

  # Service Nginx - Serveur web qui redirige les requêtes vers PHP
  webserver:
    image: nginx:alpine
    container_name: mealplanner_webserver
    ports:
      - "8001:80"  # L'API backend sera accessible sur localhost:8001
    volumes:
      - ./backend/laravel:/var/www
      - ./docker/backend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - mealplanner

  # Service Frontend Flutter - Application web
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: mealplanner_frontend
    ports:
      - "3000:80"  # L'application frontend sera accessible sur localhost:3000
    depends_on:
      - webserver
    networks:
      - mealplanner

  # Service PostgreSQL - Base de données
  db:
    image: postgres:15
    container_name: mealplanner_db
    ports:
      - "5432:5432"  # Port standard PostgreSQL
    environment:
      POSTGRES_DB: mealplanner
      POSTGRES_USER: mealplanner
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistance des données
    networks:
      - mealplanner

  # Service pgAdmin - Interface d'administration PostgreSQL
  pgadmin:
    image: dpage/pgadmin4
    container_name: mealplanner_pgadmin
    ports:
      - "5050:80"  # pgAdmin sera accessible sur localhost:5050
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db
    networks:
      - mealplanner

# Définition des volumes pour la persistance des données
volumes:
  postgres_data:
    driver: local

# Réseau personnalisé pour isoler les services
networks:
  mealplanner:
    driver: bridge
